<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Data ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Mali:wght@400;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff0f6;--bgg:linear-gradient(180deg,#fffafc 0%,#ffe9f2 55%,#ffdcea 100%);--card:#ffffff;--ink:#5c2d44;--soft:#b0688a;--rose:#ff6fa3;--rose2:#ffb8d2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bgg) fixed;color:var(--ink);font-family:Mali,'Noto Sans Thai',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;text-align:center}
h1,h2{font-family:'Playfair Display','Noto Sans Thai',Georgia,serif;font-weight:600;margin:.2em 0}
main{max-width:520px;margin:0 auto;padding:28px 18px 60px;position:relative;z-index:1}
.sub{color:var(--soft);margin:0 0 18px}
.float{position:fixed;bottom:-30px;pointer-events:none;z-index:0;animation:up linear forwards;opacity:.5}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.gal{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;background:linear-gradient(135deg,var(--rose2),var(--rose));box-shadow:0 12px 34px rgba(255,111,163,.25)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:contain}
.pic{width:100%;border-radius:18px;margin:10px 0;box-shadow:0 6px 18px rgba(255,111,163,.2)}
.row{display:flex;gap:8px}.row .pic{width:33.3%;margin:6px 0}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-style:italic}
.nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.7);color:#4a2530;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.nav.l{left:10px}.nav.r{right:10px}
.dots{margin:12px 0 4px}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--soft);opacity:.35;margin:0 4px}.dots i.on{opacity:1;background:var(--rose)}
.heart{margin:22px auto 6px;width:120px;height:108px;border:0;background:none;font-size:92px;line-height:1;cursor:pointer;animation:beat 1.4s infinite;filter:drop-shadow(0 6px 14px rgba(255,111,163,.5))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.hint{color:var(--soft);font-size:.95rem}
.days{margin-top:22px;color:var(--soft);font-size:.95rem}
.menu{display:none;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.menu.show{display:grid}
.ic{background:var(--card);border:0;border-radius:20px;padding:20px 8px;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(255,111,163,.15);opacity:0;animation:pop .5s forwards}
.ic:nth-child(2){animation-delay:.12s}.ic:nth-child(3){animation-delay:.24s}.ic:nth-child(4){animation-delay:.36s}
.ic b{display:block;font-size:2.2rem;margin-bottom:6px}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;background:var(--bgg) fixed;z-index:5;display:none;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px))}
.modal.show{display:block}
.in{max-width:520px;margin:0 auto}
.back{border:0;background:var(--card);color:var(--ink);padding:9px 16px;border-radius:20px;cursor:pointer;font:inherit;margin-bottom:18px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.reason{background:var(--card);border-radius:16px;padding:14px 16px;margin:12px 0;text-align:left;opacity:0;transform:translateY(14px);transition:.6s}
.reason.in2{opacity:1;transform:none}
.letter{text-align:left;line-height:1.8;font-size:1.08rem;white-space:pre-wrap;min-height:200px}
.btn{display:inline-block;margin-top:16px;background:var(--rose);color:#fff;text-decoration:none;padding:13px 26px;border-radius:30px;font-weight:600}
.big{font-size:3rem}
.gate{position:fixed;inset:0;z-index:10;background:var(--bgg) fixed;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate.hide{display:none}
.gate input{font:inherit;font-size:1.2rem;text-align:center;padding:12px 16px;border-radius:30px;border:2px solid var(--rose2);background:var(--card);color:var(--ink);width:min(260px,80vw);margin:14px 0 6px}
.gate .err{color:var(--rose);min-height:1.4em;font-size:.95rem}
.gate button{border:0;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="big">💌</div><h2>สำหรับ Data คนเดียวเท่านั้น</h2><p class="sub">ใส่วันครบรอบของเรา (วัน/เดือน/ปี) เพื่อเปิดดูนะ</p><input id="pw" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" autocomplete="off"><div class="err" id="err"></div><button class="btn" id="go">เปิดเลย 💗</button></div>
<main>
  <h1>Our First Date</h1>
  <p class="sub" id="sub"></p>
  <div class="gal" id="gal"></div>
  <div class="dots" id="dots"></div>
  <button class="heart" id="heart" aria-label="Open">❤️</button>
  <div class="hint" id="hint">กดที่หัวใจเลยนะ Data 💗</div>
  <div class="menu" id="menu">
    <button class="ic" data-m="why"><b>💗</b>ทำไมเค้าถึงรักเทอ</button>

    <button class="ic" data-m="song"><b>🎵</b>เพลงของเรา</button>
  </div>
  <div class="days" id="days"></div>
</main>
